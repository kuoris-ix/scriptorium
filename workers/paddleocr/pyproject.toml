[project]
name = "scriptorium-paddleocr"
version = "0.0.0"
description = "scriptorium's OCR worker for PaddleOCR"
# PaddlePaddle has no build for Python 3.14 yet.
requires-python = ">=3.11,<3.14"
dependencies = [
    "paddleocr>=3.7,<4",
    "pillow",
    # On Windows the CUDA build (an NVIDIA GPU), from PaddlePaddle's own index
    # (below); elsewhere the CPU build from PyPI. A Windows machine without an
    # NVIDIA GPU would take "paddlepaddle" here too.
    "paddlepaddle>=3.0 ; sys_platform != 'win32'",
    "paddlepaddle-gpu>=3.0 ; sys_platform == 'win32'",
    # The CUDA libraries it loads, as NVIDIA's wheels: its Windows build brings
    # none, and a CUDA installed apart may lack cuDNN or be older than its
    # build's (CUDA 12.6). The worker has them found first.
    "nvidia-cudnn-cu12>=9,<10 ; sys_platform == 'win32'",
    "nvidia-cublas-cu12>=12.6,<13 ; sys_platform == 'win32'",
    "nvidia-cuda-runtime-cu12>=12.6,<13 ; sys_platform == 'win32'",
    "nvidia-cuda-nvrtc-cu12>=12.6,<13 ; sys_platform == 'win32'",
    "nvidia-cufft-cu12 ; sys_platform == 'win32'",
    "nvidia-curand-cu12 ; sys_platform == 'win32'",
    "nvidia-cusolver-cu12 ; sys_platform == 'win32'",
    "nvidia-cusparse-cu12 ; sys_platform == 'win32'",
]

[tool.uv]
package = false

[tool.uv.sources]
paddlepaddle-gpu = [{ index = "paddle-cuda" }]

[[tool.uv.index]]
name = "paddle-cuda"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu126/"
explicit = true
