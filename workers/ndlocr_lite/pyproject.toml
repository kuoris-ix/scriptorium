[project]
name = "scriptorium-ndlocr-lite"
version = "0.0.0"
description = "scriptorium's OCR worker for NDLOCR-Lite of the National Diet Library"
requires-python = ">=3.11,<3.14"
# Not on PyPI: installed from its repository, with its `ndlocr-lite` command.
# At 1.2.3: from 1.3.0 on, its package leaves out modules the command imports
# (pdf_output_utils, version), so the command stops at once.
dependencies = ["ndlocr-lite @ git+https://github.com/ndl-lab/ndlocr-lite@1.2.3"]

[tool.uv]
package = false
# NDLOCR-Lite pins its dependencies to exact versions, some with known vulnerabilities
# fixed since: these take the fixed versions instead (within the same major version, but
# Pillow: its fixes came in 13 only).
# The worker loads Pillow, lxml and protobuf (through ONNX Runtime); pypdf (PDF output)
# and oauthlib (through flet, its GUI) aren't loaded, but are raised all the same.
override-dependencies = [
    "pillow>=13.0.0,<14",
    "lxml>=6.1.0,<7",
    "protobuf>=6.33.5,<7",
    "pypdf>=6.21.2,<7",
    "oauthlib>=4.0.0,<5",
]
