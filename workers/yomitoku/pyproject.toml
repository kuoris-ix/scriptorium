[project]
name = "scriptorium-yomitoku"
version = "0.0.0"
description = "scriptorium's OCR worker for YomiToku"
# YomiToku supports Python 3.10 to 3.13; the workers need 3.11 or later (Pillow 13).
requires-python = ">=3.11,<3.14"
dependencies = [
    "yomitoku>=0.15",
    # Named here so that Windows gets the CUDA build (below).
    "torch>=2.6",
    "torchvision>=0.21",
]

[tool.uv]
package = false

# On Windows, PyTorch built for CUDA 13.0 (an NVIDIA GPU that CUDA 13 supports, and a driver
# for it): the CUDA 12.8 builds stop at PyTorch 2.11.
# Elsewhere PyPI's: the CPU on Linux, the CPU and Apple's MPS on a Mac. uv takes the
# newest PyTorch the index has.
[tool.uv.sources]
torch = [{ index = "pytorch-cuda", marker = "sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cuda", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
