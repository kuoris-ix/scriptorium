[project]
name = "scriptorium-apple-vision"
version = "0.0.0"
description = "scriptorium's OCR worker for the Vision framework built into macOS"
requires-python = ">=3.10"
dependencies = ["ocrmac>=1.0", "pillow"]

[tool.uv]
package = false
# It runs on macOS only (Vision, through PyObjC).
environments = ["sys_platform == 'darwin'"]
