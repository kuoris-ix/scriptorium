[project]
name = "scriptorium"
version = "0.3.0"
description = "Reading scanned Japanese documents with several OCR engines, each in an environment of its own"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Kuoris9", email = "69718233+kuoris-ix@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pdfplumber>=0.11.10",
    "pillow>=12.0",
    "psutil>=7.0",
    "pypdfium2>=5.0",
    "typer>=0.12",
]

[project.scripts]
scriptorium = "scriptorium.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "reportlab>=5.0.1",
    "ruff>=0.6",
    "types-psutil>=7.2.2.20260906",
    "types-reportlab>=5.0.0.20260911",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "PTH", # flake8-use-pathlib
    "RUF", # ruff-specific
]
# Full-width punctuation in Japanese strings and comments.
allowed-confusables = ["（", "）", "：", "！", "？", "／", "＝", "＆", "～", "＊"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.mypy]
strict = true
files = ["src", "tests"]
# The tests import the workers' shared `ocr_worker` (the workers themselves aren't checked:
# they need their engines' libraries).
mypy_path = ["workers"]

[[tool.mypy.overrides]]
# Comes with pdfplumber, without type information; renders pages for OCR.
module = ["pypdfium2", "pypdfium2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets tests import their shared helpers (`ocr_files`, `sample_documents`) and the workers'
# shared `ocr_worker`.
pythonpath = ["tests", "workers"]
