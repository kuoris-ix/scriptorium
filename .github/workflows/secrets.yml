name: Secrets

# Look for secrets (tokens, keys) committed by mistake, in every pull request to master and
# every push to it; Markdown too, so on any change.
# Actions are pinned to a commit (the version in a comment), as in ci.yml.
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every commit of a pull request is scanned, so the whole history is fetched.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The findings are in the run's log; no comments on pull requests.
          GITLEAKS_ENABLE_COMMENTS: false
